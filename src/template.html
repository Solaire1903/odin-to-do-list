<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do-Lists</title>
</head>

<body>
  <header>
    <h1>Odin's To-Do-Lists</h1>
  </header>

  <div id="sidebar">
    <h2>Your Projects:</h2>

    <ul id="project-list"></ul>

    <button id="add-project-button">+ Add Project</button>
  </div>

  <dialog id="new-project-window">
    <div>
      <button id="new-project-window-close-button"><img src="./img/close.svg" alt="Close"></button>

      <form action="" method="get" id="new-project-form">
        <label for="project-title-input">Project Title:</label>
        <input type="text" id="project-title-input" required autofocus>

        <button type="submit" id="confirm-new-project-button">Confirm</button>
      </form>
    </div>
  </dialog>

  <dialog id="edit-project-window">
    <div>
      <button id="edit-project-window-close-button"><img src="./img/close.svg" alt="Close"></button>

      <form action="" method="get" id="edit-project-form">
        <label for="edit-title-input">Project Title:</label>
        <input type="text" id="edit-title-input" required autofocus>

        <button type="submit" id="confirm-edit-project-button">Confirm</button>
      </form>
    </div>
  </dialog>

  <dialog id="delete-project-window">
    <div>
      <button id="delete-project-window-close-button"><img src="./img/close.svg" alt="Close"></button>

      <p>Confirm Deletion:</p>

      <button id="delete-project-button">Delete Project</button>
    </div>
  </dialog>

  <div id="project-content">
    <h1 id="active-project-title"></h1>

    <ul id="task-list"> </ul>

    <button id="add-task-button" hidden>+ Add Task</button>
  </div>

  <dialog id="new-task-window">
    <div>
      <button id="new-task-window-close-button"><img src="./img/close.svg" alt="Close"></button>

      <form action="" method="get" id="new-task-form">
        <label for="task-title-input">Task Title:</label>
        <input type="text" id="task-title-input" required autofocus>

        <label for="task-description-input">Description:</label>
        <textarea id="task-description-input"></textarea>

        <label for="task-due-date-input">Due Date:</label>
        <input type="date" id="task-due-date-input" required>

        <p>Priority:</p>
        <div id="task-priority-input">
          <label for="priority-choice-1">Low</label>
          <input type="radio" id="priority-choice-1" name="priority" value="low" required>

          <label for="priority-choice-2">Medium</label>
          <input type="radio" id="priority-choice-2" name="priority" value="medium">

          <label for="priority-choice-3">High</label>
          <input type="radio" id="priority-choice-3" name="priority" value="high">
        </div>

        <button type="submit" id="confirm-new-task-button">Confirm</button>
      </form>
    </div>
  </dialog>

  <dialog id="description-window">
    <div>
      <button id="description-window-close-button"><img src="./img/close.svg" alt="Close"></button>

      <p id="task-description"></p>
    </div>
  </dialog>

  <dialog id="edit-task-window">
    <div>
      <button id="edit-task-window-close-button"><img src="./img/close.svg" alt="Close"></button>

      <form action="" method="get" id="edit-task-form">
        <label for="edit-task-title-input">Task Title:</label>
        <input type="text" id="edit-task-title-input" required autofocus>

        <label for="edit-task-description-input">Description:</label>
        <textarea id="edit-task-description-input"></textarea>

        <label for="edit-task-due-date-input">Due Date:</label>
        <input type="date" id="edit-task-due-date-input" required>

        <p>Priority:</p>
        <div id="edit-task-priority-input">
          <label for="edit-priority-choice-1">Low</label>
          <input type="radio" id="edit-priority-choice-1" name="edit-priority" value="low" required>

          <label for="edit-priority-choice-2">Medium</label>
          <input type="radio" id="edit-priority-choice-2" name="edit-priority" value="medium">

          <label for="edit-priority-choice-3">High</label>
          <input type="radio" id="edit-priority-choice-3" name="edit-priority" value="high">
        </div>

        <button type="submit" id="confirm-edit-task-button">Confirm</button>
      </form>
    </div>
  </dialog>

  <dialog id="delete-task-window">
    <div>
      <button id="delete-task-window-close-button"><img src="./img/close.svg" alt="Close"></button>

      <p>Confirm Deletion:</p>

      <button id="delete-task-button">Delete Task</button>
    </div>
  </dialog>

</body>

</html>
