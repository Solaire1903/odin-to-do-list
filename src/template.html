<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template</title>
  <link rel="stylesheet" href="styles.css">
  <script src="index.js" type="module" defer></script>
</head>

<body>
  <header>
    <h1>Odin's To-Do-Lists</h1>
  </header>

  <div id="sidebar">
    <h2>Your Projects:</h2>

    <ul id="project-list">
      <li>
        <div class="project-card">
          <p>Project 1</p>
          <div>
            <button><img src="img/pencil.svg" alt="Edit"></button>
            <button><img src="img/trash-can.svg" alt="Delete"></button>
          </div>
        </div>
      </li>

      <li>
        <div class="project-card">
          <p>Project 2</p>
          <div>
            <button><img src="img/pencil.svg" alt="Edit"></button>
            <button><img src="img/trash-can.svg" alt="Delete"></button>
          </div>
        </div>
      </li>

      <li>
        <div class="project-card">
          <p>Project 3</p>
          <div>
            <button><img src="img/pencil.svg" alt="Edit"></button>
            <button><img src="img/trash-can.svg" alt="Delete"></button>
          </div>
        </div>
      </li>
    </ul>

    <button id="add-project-button">+ Add Project</button>
  </div>

  <div id="project-content">
    <h1>Project 1</h1>

    <ul id="task-list"></ul>
  </div>
</body>

</html>
